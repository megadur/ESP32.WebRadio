<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telefunken RT200 Webradio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animation"></div>
    
    <div class="container">
        <header>
            <h1>TELEFUNKEN <span>RT200</span></h1>
            <p class="subtitle">Digital Tuner Configuration</p>
        </header>

        <div class="station-grid" id="stationGrid">
            <!-- Cards will be injected by JS -->
        </div>

        <div class="save-container">
            <button id="saveBtn" class="btn-primary" onclick="saveStations()">💾 Sender speichern</button>
            <button id="stopBtn" class="btn-secondary" onclick="stopRadio()">⏹ Stop</button>
            <div id="statusMsg" class="status-message"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
