[env:esp32dev]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D AUDIOKIT_BOARD=5
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=76
    -D TFT_HEIGHT=284
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=22
    -D TFT_DC=21
    -D TFT_RST=19
    -D TFT_BL=-1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=27000000
    -D CGRAM_OFFSET=1

lib_deps =
    esphome/ESPAsyncWebServer-esphome @ ^3.1.0
    bblanchon/ArduinoJson @ ^6.21.3
    bodmer/TFT_eSPI @ ^2.5.31
    robtillaart/PCF8574 @ ^0.3.8
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12
    https://github.com/pschatzmann/arduino-audiokit.git
